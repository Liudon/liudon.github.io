# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the code branch
  push:
    branches: [code]
  pull_request:
    branches: [code]

  # Touch the media cache before GitHub's default inactive-cache eviction.
  # Scheduled runs stop after restoring the cache and do not build or deploy.
  schedule:
    - cron: "17 3 */6 * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      force_ipfs:
        description: "Force IPFS deployment even when content is unchanged"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Push and manual production runs share a group so IPFS state updates cannot race.
  # Scheduled cache keepalive runs remain independent.
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'media-cache' || github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TOKEN }}
          submodules: ${{ github.event_name == 'schedule' && 'false' || 'recursive' }}

      - name: Checkout submodules
        if: github.event_name != 'schedule'
        run: git submodule update --init --recursive --remote

      - name: Get twikoo version
        if: github.event_name != 'schedule'
        id: twikoo
        run: |
          version=$(curl -fsSL https://raw.githubusercontent.com/Liudon/twikoo-netlify/main/package.json | jq -er '.dependencies."twikoo-netlify"')
          echo "Twikoo version: $version"
          echo "twikoo_version=$version" >> $GITHUB_OUTPUT

      - name: Update hugo.toml version
        if: github.event_name != 'schedule'
        env:
          TWIKOO_VERSION: ${{ steps.twikoo.outputs.twikoo_version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = os.environ["TWIKOO_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"Invalid Twikoo version: {version!r}")

          path = Path("hugo.toml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          section = None
          updated = 0

          for index, line in enumerate(lines):
              stripped = line.strip()
              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped
              elif section == "[params.twikoo]" and re.match(r"^\s*version\s*=", line):
                  lines[index], count = re.subn(
                      r'^(\s*version\s*=\s*)"[^"]*"',
                      rf'\g<1>"{version}"',
                      line,
                      count=1,
                  )
                  updated += count

          if updated != 1:
              raise SystemExit(f"Expected one params.twikoo.version, updated {updated}")

          content = "".join(lines)
          tomllib.loads(content)
          path.write_text(content, encoding="utf-8")
          PY

      # - name: Compress Image
      #   run: |
      #     wget 'https://github.com/kornelski/cavif-rs/releases/download/v1.5.4/cavif-1.5.4.zip'
      #     unzip cavif-1.5.4.zip
      #     sudo mv ./linux-generic/cavif /bin
      #     # find ./content/posts/ -type f \( -name "*.jpg" -o -name "*.png" -o -name "*.jpeg" \) -exec cavif {} \;

      # ------------------------------------------------------
      # Media cache
      #
      # 第一次：
      #
      # media-v1 不存在
      # -> 全量图片 + 视频处理
      #
      # 后续：
      #
      # source 未变化
      # -> exact cache hit
      #
      # 修改一张图片/视频
      # -> restore 最近的 media-v1
      # -> 只处理变化文件
      # ------------------------------------------------------

      - name: Restore media cache
        id: media-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/media
          key: media-v1-${{ hashFiles('content/posts/**/*.jpg', 'content/posts/**/*.jpeg', 'content/posts/**/*.png', 'content/posts/**/*.JPG', 'content/posts/**/*.JPEG', 'content/posts/**/*.PNG', 'content/posts/**/*.mp4', 'content/posts/**/*.MP4', 'static/ArchitectsDaughter-Regular.ttf', '.github/scripts/media/package.json', '.github/scripts/media/process-media.mjs') }}
          restore-keys: |
            media-v1-

      # ------------------------------------------------------
      # Node.js
      # ------------------------------------------------------

      - name: Setup Node.js
        if: github.event_name != 'schedule'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      # ------------------------------------------------------
      # Sharp
      #
      # 使用 Sharp 官方预编译 Linux 二进制。
      #
      # 不再需要：
      #
      # build-essential
      # libheif-dev
      # libaom-dev
      # libwebp-dev
      # ImageMagick configure/make
      # ------------------------------------------------------

      - name: Install Sharp
        if: github.event_name != 'schedule'
        run: |
          npm install \
            --prefix .github/scripts/media \
            --omit=dev \
            --no-audit \
            --no-fund

      # ------------------------------------------------------
      # FFmpeg
      # ------------------------------------------------------

      - name: Setup FFmpeg
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail

          NEED_APT=0

          if ! command -v ffmpeg >/dev/null 2>&1; then
            NEED_APT=1
          fi

          if ! command -v ffprobe >/dev/null 2>&1; then
            NEED_APT=1
          fi

          if ! command -v fc-match >/dev/null 2>&1; then
            NEED_APT=1
          fi

          if [[ "$NEED_APT" == "1" ]]; then
            sudo apt-get update

            sudo apt-get install -y \
              ffmpeg \
              fontconfig
          fi

          echo
          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo
          echo "FFprobe:"
          ffprobe -version | head -n 1

          echo
          echo "Checking H.264 encoder..."

          if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264; then
            echo "ERROR: FFmpeg does not contain libx264 encoder"
            exit 1
          fi

          echo "libx264: OK"

      # ------------------------------------------------------
      # Process images + videos
      # ------------------------------------------------------

      - name: Process media
        if: github.event_name != 'schedule'
        run: |
          node .github/scripts/media/process-media.mjs

      # 媒体处理成功后立即保存，后续构建或发布失败时重跑可复用。
      # 复用恢复步骤计算的 key，避免处理脚本改写源文件后重新计算哈希。
      - name: Save media cache
        if: github.event_name != 'schedule' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/media
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Setup Hugo
        if: github.event_name != 'schedule'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        if: github.event_name != 'schedule'
        run: |
          ls -l ./
          hugo --gc --minify --cleanDestinationDir

      # ------------------------------------------------------
      # Production deploy
      #
      # Pull requests only build and validate the site.
      # Production publishing only runs for pushes to code or manual runs.
      # ------------------------------------------------------

      - name: Push
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.TOKEN }}
          publish_branch: master
          force_orphan: true
          publish_dir: ./public
          cname: liudon.com

      - name: Easyindex
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo '${{ secrets.GOOGLE_INDEXING_API_TOKEN }}' > ./credentials.json

          touch ./url.csv
          echo "\"notification_type\",\"url\"" >> ./url.csv # Headers line
          echo "\"URL_UPDATED\",\"https://liudon.com/\"" >> ./url.csv # ADD URL
          echo "\"URL_UPDATED\",\"https://liudon.com/sitemap.xml\"" >> ./url.csv # ADD URL

          curl -s -L https://github.com/usk81/easyindex-cli/releases/download/v1.0.6/easyindex-cli_1.0.6_linux_amd64.tar.gz | tar xz
          chmod +x ./easyindex-cli
          ./easyindex-cli google -d -c ./url.csv

      # GitHub Pages has already been published above. Only the IPFS copy gets
      # this robots.txt, so liudon.com remains indexable.
      - name: Generate IPFS robots.txt
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "User-agent: *" > ./public/robots.txt
          echo "Disallow: /" >> ./public/robots.txt

      # Hash exactly the tree that will be merkleized for IPFS. The digest is
      # independent of mtimes/ownership, but includes paths, directories,
      # symlink targets and file bytes.
      - name: Calculate IPFS content digest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ipfs-content
        shell: bash
        run: |
          set -euo pipefail

          DIGEST=$(python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("public")
          h = hashlib.sha256()

          def add_field(tag: bytes, value: bytes) -> None:
              h.update(tag)
              h.update(len(value).to_bytes(8, "big"))
              h.update(value)

          entries = sorted(
              root.rglob("*"),
              key=lambda p: p.relative_to(root).as_posix(),
          )

          for path in entries:
              rel = path.relative_to(root).as_posix().encode("utf-8")

              if path.is_symlink():
                  add_field(b"L", rel)
                  add_field(b"T", path.readlink().as_posix().encode("utf-8"))
              elif path.is_dir():
                  add_field(b"D", rel)
              elif path.is_file():
                  add_field(b"F", rel)
                  with path.open("rb") as f:
                      while chunk := f.read(1024 * 1024):
                          h.update(chunk)
              else:
                  raise SystemExit(f"Unsupported filesystem entry: {path}")

          print("sha256:" + h.hexdigest())
          PY
          )

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "IPFS content digest: $DIGEST"

      - name: Check previous IPFS deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: ipfs-state
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
          CURRENT_DIGEST: ${{ steps.ipfs-content.outputs.digest }}
          CID_PROFILE: unixfs-v1-2025
          FORCE_IPFS: ${{ inputs.force_ipfs || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          STATE_FILE=$(mktemp)

          if gh api             "/repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=ipfs-history"             --jq '.content'             | tr -d '\n'             | base64 --decode > "$STATE_FILE"; then
            LAST_DIGEST=$(jq -r '.digest // empty' "$STATE_FILE")
            LAST_CID=$(jq -r '.cid // empty' "$STATE_FILE")
            LAST_PROFILE=$(jq -r '.cid_profile // empty' "$STATE_FILE")
          else
            echo "No previous IPFS deployment state found; deployment is required."
            LAST_DIGEST=""
            LAST_CID=""
            LAST_PROFILE=""
          fi

          echo "last_cid=$LAST_CID" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE_IPFS" == "true" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "IPFS deployment forced by workflow_dispatch."
          elif [[ "$CURRENT_DIGEST" == "$LAST_DIGEST" && "$CID_PROFILE" == "$LAST_PROFILE" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "IPFS content unchanged."
            echo "Last CID: $LAST_CID"
            echo "Skipping CAR generation and IPFS deployment."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "IPFS deployment required."
            echo "Current digest: $CURRENT_DIGEST"
            echo "Previous digest: ${LAST_DIGEST:-<none>}"
            echo "CID profile: $CID_PROFILE"
            echo "Previous profile: ${LAST_PROFILE:-<none>}"
          fi

      # ------------------------------------------------------
      # IPFS
      #
      # Merkleize ./public exactly once and produce one CAR/root CID.
      # The same CAR is then imported by both the self-hosted Kubo node and
      # Filebase, so both sides pin exactly the same root CID.
      # ------------------------------------------------------

      - name: Create IPFS CAR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        id: ipfs
        timeout-minutes: 10
        # Use the official v2 tag so compatible v2 fixes are picked up automatically.
        uses: ipshipyard/ipfs-deploy-action@v2
        with:
          path-to-deploy: ./public

          # Use the modern deterministic UnixFS/CID profile.
          cid-profile: unixfs-v1-2025

          github-token: ${{ github.token }}
          upload-car-artifact: "false"
          set-github-status: "false"
          set-pr-comment: "false"

      # ------------------------------------------------------
      # SSH tunnel -> self-hosted Kubo RPC
      # ------------------------------------------------------

      - name: Prepare SSH
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.SSHKEY }}" > ~/.ssh/ipfs_deploy
          chmod 600 ~/.ssh/ipfs_deploy

          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Connect to Kubo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        timeout-minutes: 2
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ExitOnForwardFailure=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -i ~/.ssh/ipfs_deploy \
            -L 5001:localhost:5001 \
            -fNT \
            "${{ secrets.SSHHOST }}"

          # Verify both the SSH tunnel and the remote Kubo RPC endpoint.
          curl -fsS -X POST \
            http://127.0.0.1:5001/api/v0/version | jq .

      - name: Import CAR to Kubo
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        timeout-minutes: 10
        env:
          CID: ${{ steps.ipfs.outputs.cid }}
          CAR_PATH: ${{ steps.ipfs.outputs.car-path }}
        run: |
          set -euo pipefail

          echo "Generated CID: $CID"
          echo "CAR: $CAR_PATH"

          RESPONSE=$(curl -fsS -X POST \
            -F "file=@${CAR_PATH}" \
            "http://127.0.0.1:5001/api/v0/dag/import?pin-roots=true&stats=true")

          echo "$RESPONSE"

          KUBO_CID=$(printf '%s\n' "$RESPONSE" \
            | jq -r '.Root.Cid["/"] // empty' \
            | tail -n 1)

          if [[ -z "$KUBO_CID" ]]; then
            echo "ERROR: Unable to obtain imported CID from Kubo"
            exit 1
          fi

          if [[ "$KUBO_CID" != "$CID" ]]; then
            echo "ERROR: CID mismatch"
            echo "Generated: $CID"
            echo "Kubo:      $KUBO_CID"
            exit 1
          fi

          echo "Kubo CID check: OK"

      # ------------------------------------------------------
      # Upload the exact same CAR to Filebase.
      # import=car tells Filebase to unpack the CAR and pin its root CID.
      # ------------------------------------------------------

      - name: Upload CAR to Filebase
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        timeout-minutes: 10
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FILEBASE_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FILEBASE_SECRET }}
          AWS_REGION: us-east-1
          FILEBASE_BUCKET: ${{ secrets.FILEBASE_BUCKET }}
          CID: ${{ steps.ipfs.outputs.cid }}
          CAR_PATH: ${{ steps.ipfs.outputs.car-path }}
        run: |
          set -euo pipefail

          # Keep one current CAR object instead of accumulating every deploy.
          OBJECT_KEY="liudon-blog-latest.car"

          aws \
            --endpoint-url https://s3.filebase.com \
            s3 cp \
            "$CAR_PATH" \
            "s3://${FILEBASE_BUCKET}/${OBJECT_KEY}" \
            --metadata 'import=car' \
            --only-show-errors

          echo "Filebase CAR upload: OK"
          echo "CID: $CID"

      # ------------------------------------------------------
      # Update the same IPNS identity on both publishers.
      # Both Kubo and Filebase already hold the same ipfs-action private key.
      # ------------------------------------------------------

      - name: Publish Kubo IPNS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        timeout-minutes: 5
        env:
          CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS -X POST \
            "http://127.0.0.1:5001/api/v0/name/publish?arg=/ipfs/${CID}&key=ipfs-action")

          echo "$RESPONSE"

          VALUE=$(printf '%s\n' "$RESPONSE" | jq -r '.Value // empty')

          if [[ "$VALUE" != "/ipfs/$CID" ]]; then
            echo "ERROR: Kubo IPNS publish verification failed"
            exit 1
          fi

          echo "Kubo IPNS: OK"

      - name: Publish Filebase IPNS
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        timeout-minutes: 5
        env:
          FILEBASE_KEY: ${{ secrets.FILEBASE_KEY }}
          FILEBASE_SECRET: ${{ secrets.FILEBASE_SECRET }}
          CID: ${{ steps.ipfs.outputs.cid }}
        run: |
          set -euo pipefail

          AUTH=$(printf '%s:%s' \
            "$FILEBASE_KEY" \
            "$FILEBASE_SECRET" \
            | base64 -w 0)

          curl -fsS \
            -X PUT \
            -H "Authorization: Bearer ${AUTH}" \
            -H "Content-Type: application/json" \
            -d "{\"cid\":\"${CID}\"}" \
            "https://api.filebase.io/v1/names/ipfs-action"

          echo

          RESPONSE=$(curl -fsS \
            -H "Authorization: Bearer ${AUTH}" \
            "https://api.filebase.io/v1/names/ipfs-action")

          FILEBASE_CID=$(printf '%s\n' "$RESPONSE" | jq -r '.cid // empty')

          if [[ "$FILEBASE_CID" != "$CID" ]]; then
            echo "ERROR: Filebase IPNS verification failed"
            echo "Expected: $CID"
            echo "Actual:   $FILEBASE_CID"
            exit 1
          fi

          echo "Filebase IPNS: OK"

      # Only a fully successful Kubo + Filebase + dual-IPNS deployment reaches
      # this step. Normalize the whole history so workflow re-runs and repeated
      # immutable CIDs never inflate the Time Machine snapshot count.
      - name: Record IPFS deployment state
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        env:
          CID: ${{ steps.ipfs.outputs.cid }}
          DIGEST: ${{ steps.ipfs-content.outputs.digest }}
          CID_PROFILE: unixfs-v1-2025
        shell: bash
        run: |
          set -euo pipefail

          HISTORY_DIR=$(mktemp -d)
          git fetch origin ipfs-history
          git worktree add --detach "$HISTORY_DIR" origin/ipfs-history

          cleanup() {
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          export HISTORY_DIR
          DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          export DEPLOYED_AT

          python3 - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          root = Path(os.environ["HISTORY_DIR"])
          latest_path = root / "latest.json"
          months_path = root / "months.json"
          history_dir = root / "history"
          history_dir.mkdir(parents=True, exist_ok=True)

          cid = os.environ["CID"]
          digest = os.environ["DIGEST"]
          profile = os.environ["CID_PROFILE"]
          commit = os.environ["GITHUB_SHA"]
          deployed_at = os.environ["DEPLOYED_AT"]
          workflow_run_id = int(os.environ["GITHUB_RUN_ID"])
          workflow_run_attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])

          current = {
              "digest": digest,
              "cid": cid,
              "cid_profile": profile,
              "source_commit": commit,
              "deployed_at": deployed_at,
              "workflow_run_id": workflow_run_id,
              "workflow_run_attempt": workflow_run_attempt,
          }

          # Load every existing snapshot row. Historical recovered rows may not
          # have workflow_run_id / workflow_run_attempt; keep them as-is.
          records = []
          for path in sorted(history_dir.glob("*.jsonl")):
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  if not line.strip():
                      continue
                  try:
                      entry = json.loads(line)
                  except json.JSONDecodeError as exc:
                      raise SystemExit(
                          f"Invalid JSON in {path.name}:{line_number}: {exc}"
                      )

                  if not entry.get("cid") or not entry.get("deployed_at"):
                      raise SystemExit(
                          f"Missing cid/deployed_at in {path.name}:{line_number}"
                      )
                  records.append(entry)

          records.append(current)

          # Stage 1: one final successful record per workflow run.
          # Legacy rows without workflow_run_id cannot be grouped safely, so
          # they remain independent and are handled by CID deduplication below.
          by_run = {}
          legacy = []

          for entry in records:
              run_id = entry.get("workflow_run_id")
              if run_id is None:
                  legacy.append(entry)
                  continue

              try:
                  run_id = int(run_id)
                  attempt = int(entry.get("workflow_run_attempt", 1))
              except (TypeError, ValueError):
                  raise SystemExit(
                      f"Invalid workflow run metadata for CID {entry.get('cid')}"
                  )

              entry["workflow_run_id"] = run_id
              entry["workflow_run_attempt"] = attempt

              previous = by_run.get(run_id)
              if previous is None:
                  by_run[run_id] = entry
                  continue

              previous_attempt = int(previous.get("workflow_run_attempt", 1))
              if attempt > previous_attempt:
                  by_run[run_id] = entry
              elif attempt == previous_attempt:
                  # A single attempt should have one successful deployment.
                  # If duplicate rows exist, keep the later deployment record.
                  if entry["deployed_at"] > previous["deployed_at"]:
                      by_run[run_id] = entry

          normalized = legacy + list(by_run.values())

          # Stage 2: one immutable snapshot per CID globally.
          # If separate runs publish the same CID, the first successful
          # deployment is the historical point represented by that snapshot.
          by_cid = {}
          for entry in normalized:
              existing = by_cid.get(entry["cid"])
              if existing is None or entry["deployed_at"] < existing["deployed_at"]:
                  by_cid[entry["cid"]] = entry

          snapshots = sorted(
              by_cid.values(),
              key=lambda entry: (entry["deployed_at"], entry["cid"]),
          )

          # Re-shard the normalized history from scratch. This also removes a
          # stale row when a later attempt of the same workflow run wins.
          for path in history_dir.glob("*.jsonl"):
              path.unlink()

          by_month = defaultdict(list)
          for entry in snapshots:
              month = entry["deployed_at"][:7]
              if len(month) != 7 or month[4] != "-":
                  raise SystemExit(
                      f"Invalid deployed_at for CID {entry['cid']}: "
                      f"{entry['deployed_at']!r}"
                  )
              by_month[month].append(entry)

          for month in sorted(by_month):
              month_path = history_dir / f"{month}.jsonl"
              month_path.write_text(
                  "".join(
                      json.dumps(
                          entry,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      )
                      + "\n"
                      for entry in by_month[month]
                  ),
                  encoding="utf-8",
              )

          months = {
              "version": 2,
              "total": len(snapshots),
              "months": [
                  {
                      "month": month,
                      "count": len(by_month[month]),
                  }
                  for month in sorted(by_month, reverse=True)
              ],
          }

          if months["total"] != sum(item["count"] for item in months["months"]):
              raise SystemExit("months.json count validation failed")

          months_path.write_text(
              json.dumps(months, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # latest.json describes the current successful deployment, even if
          # its CID already existed historically and was deduplicated there.
          latest = {
              "version": 1,
              **current,
          }
          latest_path.write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          print(
              "History normalized: "
              f"{len(records)} input rows -> "
              f"{len(snapshots)} unique snapshot CIDs"
          )
          for item in months["months"]:
              print(f"  {item['month']}: {item['count']}")
          PY

          git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
          git -C "$HISTORY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add latest.json months.json history

          if git -C "$HISTORY_DIR" diff --cached --quiet; then
            echo "IPFS deployment state is already up to date."
          else
            git -C "$HISTORY_DIR" commit -m "record normalized IPFS deployment history"

            for attempt in {1..5}; do
              echo "History push attempt $attempt/5"
              git -C "$HISTORY_DIR" fetch origin ipfs-history
              git -C "$HISTORY_DIR" rebase origin/ipfs-history

              if git -C "$HISTORY_DIR" push origin HEAD:ipfs-history; then
                echo "Normalized IPFS deployment history recorded on ipfs-history."
                break
              fi

              if [[ "$attempt" == "5" ]]; then
                echo "ERROR: unable to push IPFS deployment history after 5 attempts"
                exit 1
              fi

              sleep $((attempt * 2))
            done
          fi

      # Capture the newly published snapshot directly from the local ./public
      # tree. The legacy screenshots/<cid>.webp path is frozen; new captures
      # are written under captures/<profile-id>/<cid>/.
      - name: Capture current IPFS history screenshot
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.ipfs-state.outputs.deploy == 'true'
        continue-on-error: true
        env:
          CID: ${{ steps.ipfs.outputs.cid }}
          CONTENT_DIGEST: ${{ steps.ipfs-content.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
          IPFS_GATEWAY_BASE: https://liudon.xyz/ipfs
          SCREENSHOT_WIDTH: "1440"
          SCREENSHOT_HEIGHT: "900"
          SCREENSHOT_ATTEMPTS: "2"
          CAPTURE_MAX_PIXELS: "40000000"
          CAPTURE_ENVIRONMENT_ID: ubuntu-24.04-playwright-1.56.1-sharp-0.35.0-noto-cjk-v1
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"

          FONT_VERSION=$(dpkg-query -W -f='\${Version}' fonts-noto-cjk)
          FONT_EVIDENCE="fonts-noto-cjk=${FONT_VERSION}"
          echo "Capture font evidence: ${FONT_EVIDENCE}"

          npm install \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            playwright@1.56.1 sharp@0.35.0

          npx playwright install --with-deps chromium

          # Re-hash the exact public tree immediately before capture. Nothing
          # may rewrite public between CAR creation and the local screenshot.
          CURRENT_DIGEST=$(python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path("public")
          h = hashlib.sha256()

          def add_field(tag: bytes, value: bytes) -> None:
              h.update(tag)
              h.update(len(value).to_bytes(8, "big"))
              h.update(value)

          entries = sorted(
              root.rglob("*"),
              key=lambda p: p.relative_to(root).as_posix(),
          )

          for path in entries:
              rel = path.relative_to(root).as_posix().encode("utf-8")
              if path.is_symlink():
                  add_field(b"L", rel)
                  add_field(b"T", path.readlink().as_posix().encode("utf-8"))
              elif path.is_dir():
                  add_field(b"D", rel)
              elif path.is_file():
                  add_field(b"F", rel)
                  with path.open("rb") as f:
                      while chunk := f.read(1024 * 1024):
                          h.update(chunk)
              else:
                  raise SystemExit(f"Unsupported filesystem entry: {path}")

          print("sha256:" + h.hexdigest())
          PY
          )

          if [[ "$CURRENT_DIGEST" != "$CONTENT_DIGEST" ]]; then
            echo "ERROR: public changed between CAR creation and screenshot capture"
            echo "CAR digest:     $CONTENT_DIGEST"
            echo "Capture digest: $CURRENT_DIGEST"
            exit 1
          fi

          HISTORY_DIR=$(mktemp -d)
          SERVER_PID=""

          cleanup() {
            if [[ -n "$SERVER_PID" ]]; then
              kill "$SERVER_PID" >/dev/null 2>&1 || true
            fi
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git fetch origin ipfs-history
          git worktree add --detach "$HISTORY_DIR" origin/ipfs-history

          python3 -m http.server 4173 \
            --bind 127.0.0.1 \
            --directory ./public \
            >"${RUNNER_TEMP}/ipfs-history-http.log" 2>&1 &
          SERVER_PID=$!

          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "Local screenshot server failed to start."
              cat "${RUNNER_TEMP}/ipfs-history-http.log" || true
              exit 1
            fi
            sleep 0.5
          done

          CAPTURE_CID="$CID" \
          CAPTURE_CONTENT_DIGEST="$CONTENT_DIGEST" \
          CAPTURE_SOURCE_COMMIT="$SOURCE_COMMIT" \
          CAPTURE_FONT_EVIDENCE="$FONT_EVIDENCE" \
          SCREENSHOT_SOURCE_URL="http://127.0.0.1:4173/" \
          node .github/scripts/ipfs-history/capture-screenshots.mjs "$HISTORY_DIR"

          PROFILE_ID=$(jq -er '.profile_id' "$HISTORY_DIR/captures/current-profile.json")
          CAPTURE_DIR="captures/$PROFILE_ID/$CID"

          git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
          git -C "$HISTORY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add "captures/current-profile.json" "$CAPTURE_DIR"

          if git -C "$HISTORY_DIR" diff --cached --quiet; then
            echo "Current-profile capture already exists for CID: $CID"
          else
            PATCH_DIR="${RUNNER_TEMP}/ipfs-history-current-capture"
            rm -rf "$PATCH_DIR"
            mkdir -p "$PATCH_DIR/captures/$PROFILE_ID"
            cp "$HISTORY_DIR/captures/current-profile.json" "$PATCH_DIR/captures/current-profile.json"
            cp -R "$HISTORY_DIR/$CAPTURE_DIR" "$PATCH_DIR/captures/$PROFILE_ID/$CID"

            for attempt in {1..5}; do
              echo "Capture push attempt $attempt/5"
              git -C "$HISTORY_DIR" fetch origin ipfs-history
              git -C "$HISTORY_DIR" reset --hard origin/ipfs-history

              if CAPTURE_REQUIRE_CURRENT_PROFILE=true \
                 CAPTURE_ENVIRONMENT_ID="$CAPTURE_ENVIRONMENT_ID" \
                 SCREENSHOT_WIDTH="$SCREENSHOT_WIDTH" \
                 SCREENSHOT_HEIGHT="$SCREENSHOT_HEIGHT" \
                 node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR" "$CID"; then
                echo "Remote already has a valid current-profile capture for CID: $CID"
                break
              fi

              mkdir -p "$HISTORY_DIR/captures/$PROFILE_ID"
              cp "$PATCH_DIR/captures/current-profile.json" "$HISTORY_DIR/captures/current-profile.json"
              rm -rf "$HISTORY_DIR/$CAPTURE_DIR"
              cp -R "$PATCH_DIR/captures/$PROFILE_ID/$CID" "$HISTORY_DIR/captures/$PROFILE_ID/$CID"

              git -C "$HISTORY_DIR" add "captures/current-profile.json" "$CAPTURE_DIR"
              git -C "$HISTORY_DIR" commit -m "capture IPFS history screenshot"

              if git -C "$HISTORY_DIR" push origin HEAD:ipfs-history; then
                echo "Captured current-profile screenshot for CID: $CID"
                break
              fi

              if [[ "$attempt" == "5" ]]; then
                echo "ERROR: unable to push IPFS capture after 5 attempts"
                exit 1
              fi

              sleep $((attempt * 2))
            done
          fi

      - name: IPFS deployment summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY: ${{ steps.ipfs-state.outputs.deploy }}
          CID: ${{ steps.ipfs.outputs.cid }}
          LAST_CID: ${{ steps.ipfs-state.outputs.last_cid }}
          DIGEST: ${{ steps.ipfs-content.outputs.digest }}
        run: |
          {
            echo "## IPFS deployment"
            echo
            echo "- Content digest: $DIGEST"

            if [[ "$DEPLOY" == "true" ]]; then
              echo "- Status: deployed"
              echo "- CID: $CID"
              echo "- VPS Kubo: OK"
              echo "- Filebase: OK"
              echo "- Kubo IPNS: updated"
              echo "- Filebase IPNS: updated"
              echo "- History: recorded"
            else
              echo "- Status: skipped (content unchanged)"
              echo "- CID: $LAST_CID"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
