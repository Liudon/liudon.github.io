name: Repair IPFS History Screenshots

on:
  push:
    branches: [code]
    paths:
      - ".github/scripts/ipfs-history/capture-screenshots.mjs"
      - ".github/scripts/ipfs-history/capture-data.mjs"
      - ".github/scripts/ipfs-history/capture-data.test.mjs"
      - ".github/scripts/ipfs-history/capture-evidence.mjs"
      - ".github/scripts/ipfs-history/capture-evidence.test.mjs"
      - ".github/scripts/ipfs-history/capture-ads.mjs"
      - ".github/scripts/ipfs-history/capture-ads.test.mjs"
      - ".github/scripts/ipfs-history/check-capture.mjs"
      - ".github/workflows/ipfs-history-screenshots.yml"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-history-screenshot-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      SCREENSHOT_WIDTH: "1440"
      SCREENSHOT_HEIGHT: "900"
      SCREENSHOT_ATTEMPTS: "3"
      CAPTURE_MAX_PIXELS: "40000000"
      CAPTURE_ENVIRONMENT_ID: ubuntu-24.04-playwright-1.56.1-sharp-0.35.0-noto-cjk-v1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'code' }}
          token: ${{ secrets.TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test capture profile and evidence
        run: |
          node --test \
            .github/scripts/ipfs-history/capture-data.test.mjs \
            .github/scripts/ipfs-history/capture-evidence.test.mjs

      - name: Checkout IPFS history
        id: history
        shell: bash
        run: |
          set -euo pipefail

          HISTORY_DIR="${RUNNER_TEMP}/ipfs-history"
          git fetch origin ipfs-history
          git worktree add --detach "$HISTORY_DIR" origin/ipfs-history

          echo "dir=$HISTORY_DIR" >> "$GITHUB_OUTPUT"

      - name: Find missing current-profile screenshots
        id: missing
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          CAPTURE_REQUIRE_CURRENT_PROFILE: "true"
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR")
          COUNT=$(jq -r '.missing' <<< "$STATUS")
          PROFILE_ID=$(jq -r '.profile_id // empty' <<< "$STATUS")

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "profile_id=$PROFILE_ID" >> "$GITHUB_OUTPUT"
          echo "Missing/invalid current-profile screenshots: $COUNT"
          echo "Target capture profile: $PROFILE_ID"

      - name: Install screenshot dependencies
        if: steps.missing.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"

          npm install \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            playwright@1.56.1 sharp@0.35.0

          npx playwright install --with-deps chromium

      - name: Test ad exclusion
        if: steps.missing.outputs.count != '0'
        run: node --test .github/scripts/ipfs-history/capture-ads.test.mjs

      - name: Repair missing screenshots
        if: steps.missing.outputs.count != '0'
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          IPFS_GATEWAY_BASE: https://liudon.xyz/ipfs
        shell: bash
        run: |
          set -euo pipefail

          FONT_VERSION=$(dpkg-query -W -f='${Version}' fonts-noto-cjk)
          CAPTURE_FONT_EVIDENCE="fonts-noto-cjk=${FONT_VERSION}" \
          node .github/scripts/ipfs-history/capture-screenshots.mjs "$HISTORY_DIR"

      # Preserve every successful current-profile capture even when another
      # CID fails. The completed workflow still triggers visual-index readiness,
      # which will defer publication until the profile is complete.
      - name: Commit repaired captures
        if: always() && steps.missing.outputs.count != '0'
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          CAPTURE_REQUIRE_CURRENT_PROFILE: "true"
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$HISTORY_DIR/captures/current-profile.json" ]]; then
            echo "No current-profile marker was produced."
            exit 0
          fi

          PROFILE_ID=$(jq -er '.profile_id' "$HISTORY_DIR/captures/current-profile.json")

          git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
          git -C "$HISTORY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add captures

          if git -C "$HISTORY_DIR" diff --cached --quiet; then
            echo "No repaired captures to commit."
            exit 0
          fi

          PATCH_DIR="${RUNNER_TEMP}/ipfs-history-repair-patch"
          CID_LIST="${RUNNER_TEMP}/ipfs-history-repaired-cids.txt"
          rm -rf "$PATCH_DIR"
          mkdir -p "$PATCH_DIR/captures/$PROFILE_ID"

          cp "$HISTORY_DIR/captures/current-profile.json" \
            "$PATCH_DIR/captures/current-profile.json"

          git -C "$HISTORY_DIR" diff --cached --name-only -- "captures/$PROFILE_ID" |
          awk -F/ '$NF == "meta.json" { print $(NF-1) }' |
          sort -u > "$CID_LIST"

          if [[ ! -s "$CID_LIST" ]]; then
            echo "No successful current-profile captures were produced; not publishing the profile marker."
            exit 0
          fi

          while IFS= read -r cid; do
            [[ -n "$cid" ]] || continue
            cp -R "$HISTORY_DIR/captures/$PROFILE_ID/$cid" \
              "$PATCH_DIR/captures/$PROFILE_ID/$cid"
          done < "$CID_LIST"

          for attempt in {1..5}; do
            echo "Repair push attempt $attempt/5"
            git -C "$HISTORY_DIR" fetch origin ipfs-history
            git -C "$HISTORY_DIR" reset --hard origin/ipfs-history

            mkdir -p "$HISTORY_DIR/captures/$PROFILE_ID"
            cp "$PATCH_DIR/captures/current-profile.json" \
              "$HISTORY_DIR/captures/current-profile.json"
            git -C "$HISTORY_DIR" add "captures/current-profile.json"

            while IFS= read -r cid; do
              [[ -n "$cid" ]] || continue

              if node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR" "$cid"; then
                echo "Remote already has a valid target-profile capture for $cid."
                continue
              fi

              rm -rf "$HISTORY_DIR/captures/$PROFILE_ID/$cid"
              cp -R "$PATCH_DIR/captures/$PROFILE_ID/$cid" \
                "$HISTORY_DIR/captures/$PROFILE_ID/$cid"
              git -C "$HISTORY_DIR" add "captures/$PROFILE_ID/$cid"
            done < "$CID_LIST"

            if git -C "$HISTORY_DIR" diff --cached --quiet; then
              echo "Remote already contains all repaired captures."
              break
            fi

            git -C "$HISTORY_DIR" commit -m "repair IPFS history captures"

            if git -C "$HISTORY_DIR" push origin HEAD:ipfs-history; then
              echo "Repaired IPFS history captures pushed."
              break
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "ERROR: unable to push repaired captures after 5 attempts"
              exit 1
            fi

            sleep $((attempt * 2))
          done

      - name: Repair summary
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          MISSING_BEFORE: ${{ steps.missing.outputs.count }}
          CAPTURE_REQUIRE_CURRENT_PROFILE: "true"
        shell: bash
        run: |
          if [[ -d "$HISTORY_DIR/history" ]]; then
            STATUS=$(node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR")
            {
              echo "## IPFS history screenshot repair"
              echo "- Target profile: $(jq -r '.profile_id // "unknown"' <<< "$STATUS")"
              echo "- Missing/invalid before run: ${MISSING_BEFORE:-unknown}"
              echo "- Valid current-profile captures: $(jq -r '.valid' <<< "$STATUS")"
              echo "- Missing/invalid current-profile captures: $(jq -r '.missing' <<< "$STATUS")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup history worktree
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          if [[ -n "${HISTORY_DIR:-}" ]]; then
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          fi
