name: Repair IPFS History Screenshots

on:
  push:
    branches: [code]
    paths:
      - ".github/scripts/ipfs-history/capture-screenshots.mjs"
      - ".github/scripts/ipfs-history/capture-data.mjs"
      - ".github/scripts/ipfs-history/check-capture.mjs"
      - ".github/workflows/ipfs-history-screenshots.yml"
  schedule:
    # Run off the top of the hour to reduce GitHub Actions schedule congestion.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-history-screenshot-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Checkout IPFS history
        id: history
        shell: bash
        run: |
          set -euo pipefail

          HISTORY_DIR="${RUNNER_TEMP}/ipfs-history"
          git fetch origin ipfs-history
          git worktree add --detach "$HISTORY_DIR" origin/ipfs-history

          echo "dir=$HISTORY_DIR" >> "$GITHUB_OUTPUT"

      - name: Find missing screenshots
        id: missing
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          COUNT=$(node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR" | jq -r '.missing')

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Missing/invalid IPFS history screenshots: $COUNT"

      - name: Install screenshot dependencies
        if: steps.missing.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"

          npm install \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            playwright@1.56.1 sharp@0.35.0

          npx playwright install --with-deps chromium

      - name: Repair missing screenshots
        if: steps.missing.outputs.count != '0'
        env:
          IPFS_GATEWAY_BASE: https://liudon.xyz/ipfs
          SCREENSHOT_WIDTH: "1440"
          SCREENSHOT_HEIGHT: "900"
          SCREENSHOT_ATTEMPTS: "3"
        run: |
          node .github/scripts/ipfs-history/capture-screenshots.mjs \
            "${{ steps.history.outputs.dir }}"

      # Preserve every successful repair even if another CID still failed.
      # The failed job remains visible in Actions, and the next scheduled run
      # retries only the screenshots that are still absent.
      - name: Commit repaired screenshots
        if: always() && steps.missing.outputs.count != '0'
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
          git -C "$HISTORY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add screenshots

          if git -C "$HISTORY_DIR" diff --cached --quiet; then
            echo "No repaired screenshots to commit."
          else
            # Save the repaired files outside Git. Before each push attempt,
            # rebuild the commit on top of the latest remote ipfs-history.
            # If main CI already published the same CID at capture_version 7,
            # keep the remote copy instead of creating a binary merge conflict.
            PATCH_DIR="${RUNNER_TEMP}/ipfs-history-repair-patch"
            rm -rf "$PATCH_DIR"
            mkdir -p "$PATCH_DIR/screenshots/meta"

            git -C "$HISTORY_DIR" diff --cached --name-only -- screenshots/meta |
            while IFS= read -r file; do
              cid=$(basename "$file" .json)
              cp "$HISTORY_DIR/$file" "$PATCH_DIR/$file"
              cp "$HISTORY_DIR/screenshots/$cid.webp" "$PATCH_DIR/screenshots/$cid.webp"
            done

            for attempt in {1..5}; do
              echo "Push attempt $attempt/5"
              git -C "$HISTORY_DIR" fetch origin ipfs-history
              git -C "$HISTORY_DIR" reset --hard origin/ipfs-history

              # Metadata is the authoritative list of recaptured CIDs.
              # A recapture can produce byte-identical WebP output while still
              # upgrading capture_version/settings in metadata. Iterating only
              # changed .webp files would silently drop those metadata-only
              # upgrades.
              find "$PATCH_DIR/screenshots/meta" -maxdepth 1 -type f -name '*.json' -print0 |
              while IFS= read -r -d '' repaired_meta; do
                name=$(basename "$repaired_meta")
                cid="${name%.json}"
                remote_meta="$HISTORY_DIR/screenshots/meta/$cid.json"
                repaired_webp="$PATCH_DIR/screenshots/$cid.webp"

                if node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR" "$cid"; then
                  echo "Remote already has capture v7 for $cid; keeping remote copy."
                  continue
                fi

                mkdir -p "$HISTORY_DIR/screenshots/meta"
                cp "$repaired_meta" "$remote_meta"

                cp "$repaired_webp" "$HISTORY_DIR/screenshots/$cid.webp"
              done

              git -C "$HISTORY_DIR" add screenshots

              if git -C "$HISTORY_DIR" diff --cached --quiet; then
                echo "Remote already contains all repaired screenshots."
                break
              fi

              git -C "$HISTORY_DIR" commit -m "repair IPFS history screenshots"

              if git -C "$HISTORY_DIR" push origin HEAD:ipfs-history; then
                echo "Repaired IPFS history screenshots pushed."
                break
              fi

              if [[ "$attempt" == "5" ]]; then
                echo "ERROR: unable to push repaired screenshots after 5 attempts"
                exit 1
              fi

              sleep $((attempt * 2))
            done
          fi

      - name: Repair summary
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          MISSING_BEFORE: ${{ steps.missing.outputs.count }}
        shell: bash
        run: |
          if [[ -d "$HISTORY_DIR/history" ]]; then
            STATUS=$(node .github/scripts/ipfs-history/check-capture.mjs "$HISTORY_DIR")
            {
              echo "## IPFS history screenshot repair"
              echo "- Missing/invalid before run: $MISSING_BEFORE"
              echo "- Valid screenshots: $(jq -r '.valid' <<< "$STATUS")"
              echo "- Missing/invalid screenshots: $(jq -r '.missing' <<< "$STATUS")"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup history worktree
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          if [[ -n "${HISTORY_DIR:-}" ]]; then
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          fi
