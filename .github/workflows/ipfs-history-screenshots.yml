name: Repair IPFS History Screenshots

on:
  push:
    branches: [code]
    paths:
      - ".github/scripts/ipfs-history/capture-screenshots.mjs"
      - ".github/workflows/ipfs-history-screenshots.yml"
  schedule:
    # Run off the top of the hour to reduce GitHub Actions schedule congestion.
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipfs-history-screenshot-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Checkout IPFS history
        id: history
        shell: bash
        run: |
          set -euo pipefail

          HISTORY_DIR="${RUNNER_TEMP}/ipfs-history"
          git fetch origin ipfs-history
          git worktree add --detach "$HISTORY_DIR" origin/ipfs-history

          echo "dir=$HISTORY_DIR" >> "$GITHUB_OUTPUT"

      - name: Find missing screenshots
        id: missing
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          COUNT=$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["HISTORY_DIR"])
          history_dir = root / "history"
          screenshot_dir = root / "screenshots"

          cids = set()
          for path in sorted(history_dir.glob("*.jsonl")):
              for line_number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  start=1,
              ):
                  if not line.strip():
                      continue
                  entry = json.loads(line)
                  cid = entry.get("cid")
                  if not cid:
                      raise SystemExit(f"Missing cid in {path.name}:{line_number}")
                  cids.add(cid)

          missing = []
          for cid in sorted(cids):
              screenshot = screenshot_dir / f"{cid}.webp"
              metadata = screenshot_dir / "meta" / f"{cid}.json"
              valid = screenshot.exists() and screenshot.stat().st_size >= 10_000

              if valid:
                  try:
                      meta = json.loads(metadata.read_text(encoding="utf-8"))
                      valid = meta.get("capture_version") == 6
                  except (FileNotFoundError, json.JSONDecodeError):
                      valid = False

              if not valid:
                  missing.append(cid)

          print(len(missing))
          PY
          )

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Missing/invalid IPFS history screenshots: $COUNT"

      - name: Install screenshot dependencies
        if: steps.missing.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f
          fc-match "Noto Sans CJK SC"

          npm install \
            --no-save \
            --package-lock=false \
            --no-audit \
            --no-fund \
            playwright-core@latest

      - name: Repair missing screenshots
        if: steps.missing.outputs.count != '0'
        env:
          IPFS_GATEWAY_BASE: https://liudon.xyz/ipfs
          SCREENSHOT_WIDTH: "1440"
          SCREENSHOT_HEIGHT: "900"
          SCREENSHOT_QUALITY: "72"
          SCREENSHOT_ATTEMPTS: "3"
          SCREENSHOT_CAPTURE_VERSION: "6"
        run: |
          node .github/scripts/ipfs-history/capture-screenshots.mjs \
            "${{ steps.history.outputs.dir }}"

      # Preserve every successful repair even if another CID still failed.
      # The failed job remains visible in Actions, and the next scheduled run
      # retries only the screenshots that are still absent.
      - name: Commit repaired screenshots
        if: always() && steps.missing.outputs.count != '0'
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail

          git -C "$HISTORY_DIR" config user.name "github-actions[bot]"
          git -C "$HISTORY_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$HISTORY_DIR" add screenshots

          if git -C "$HISTORY_DIR" diff --cached --quiet; then
            echo "No repaired screenshots to commit."
          else
            # Save the repaired files outside Git. Before each push attempt,
            # rebuild the commit on top of the latest remote ipfs-history.
            # If main CI already published the same CID at capture_version 6,
            # keep the remote copy instead of creating a binary merge conflict.
            PATCH_DIR="${RUNNER_TEMP}/ipfs-history-repair-patch"
            rm -rf "$PATCH_DIR"
            mkdir -p "$PATCH_DIR/screenshots/meta"

            git -C "$HISTORY_DIR" diff --cached --name-only -z | while IFS= read -r -d '' file; do
              mkdir -p "$PATCH_DIR/$(dirname "$file")"
              cp "$HISTORY_DIR/$file" "$PATCH_DIR/$file"
            done

            for attempt in {1..5}; do
              echo "Push attempt $attempt/5"
              git -C "$HISTORY_DIR" fetch origin ipfs-history
              git -C "$HISTORY_DIR" reset --hard origin/ipfs-history

              find "$PATCH_DIR/screenshots" -maxdepth 1 -type f -name '*.webp' -print0 |
              while IFS= read -r -d '' repaired; do
                name=$(basename "$repaired")
                cid="${name%.webp}"
                remote_meta="$HISTORY_DIR/screenshots/meta/$cid.json"

                remote_is_current=false
                if [[ -f "$remote_meta" ]] && jq -e '.capture_version == 6' "$remote_meta" >/dev/null 2>&1; then
                  remote_is_current=true
                fi

                if [[ "$remote_is_current" == "true" ]]; then
                  echo "Remote already has capture v6 for $cid; keeping remote copy."
                  continue
                fi

                cp "$repaired" "$HISTORY_DIR/screenshots/$cid.webp"
                if [[ -f "$PATCH_DIR/screenshots/meta/$cid.json" ]]; then
                  mkdir -p "$HISTORY_DIR/screenshots/meta"
                  cp "$PATCH_DIR/screenshots/meta/$cid.json" "$remote_meta"
                fi
              done

              git -C "$HISTORY_DIR" add screenshots

              if git -C "$HISTORY_DIR" diff --cached --quiet; then
                echo "Remote already contains all repaired screenshots."
                break
              fi

              git -C "$HISTORY_DIR" commit -m "repair IPFS history screenshots"

              if git -C "$HISTORY_DIR" push origin HEAD:ipfs-history; then
                echo "Repaired IPFS history screenshots pushed."
                break
              fi

              if [[ "$attempt" == "5" ]]; then
                echo "ERROR: unable to push repaired screenshots after 5 attempts"
                exit 1
              fi

              sleep $((attempt * 2))
            done
          fi

      - name: Repair summary
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
          MISSING_BEFORE: ${{ steps.missing.outputs.count }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["HISTORY_DIR"])
          history_dir = root / "history"
          screenshot_dir = root / "screenshots"

          cids = set()
          for path in history_dir.glob("*.jsonl"):
              for line in path.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      entry = json.loads(line)
                      if entry.get("cid"):
                          cids.add(entry["cid"])

          valid = 0
          missing = 0
          for cid in cids:
              screenshot = screenshot_dir / f"{cid}.webp"
              metadata = screenshot_dir / "meta" / f"{cid}.json"
              is_valid = screenshot.exists() and screenshot.stat().st_size >= 10_000

              if is_valid:
                  try:
                      meta = json.loads(metadata.read_text(encoding="utf-8"))
                      is_valid = meta.get("capture_version") == 6
                  except (FileNotFoundError, json.JSONDecodeError):
                      is_valid = False

              if is_valid:
                  valid += 1
              else:
                  missing += 1

          print("## IPFS history screenshot repair")
          print()
          print(f"- Missing/invalid before run: {os.environ.get('MISSING_BEFORE', 'unknown')}")
          print(f"- Valid screenshots after run: {valid}")
          print(f"- Still missing/invalid: {missing}")
          PY

      - name: Cleanup history worktree
        if: always()
        env:
          HISTORY_DIR: ${{ steps.history.outputs.dir }}
        shell: bash
        run: |
          if [[ -n "${HISTORY_DIR:-}" ]]; then
            git worktree remove --force "$HISTORY_DIR" >/dev/null 2>&1 || true
          fi
