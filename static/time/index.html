<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0a0a0a">
  <title>Time Machine · 流动</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--panel:rgba(14,14,14,.94);--accent:#ff9500;--accent2:#ffaa00;--text:#e0e0e0;--muted:#888;--border:rgba(255,149,0,.38);--danger:#ff6b6b;--font:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Monaco,"Cascadia Mono",Consolas,"Liberation Mono","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI",monospace}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font)}button,a{font:inherit}
    .snapshot{position:fixed;inset:0;display:block;width:100%;height:100vh;height:100dvh;border:0;background:var(--bg);opacity:0;transition:opacity .18s ease}.snapshot.is-visible{opacity:1}
    .travel{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at center,rgba(255,149,0,.07),transparent 48%),var(--bg);transition:opacity .18s ease,visibility .18s ease}.travel.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
    .terminal{width:min(680px,100%);min-height:190px;padding:22px 24px;border:1px solid var(--border);border-radius:10px;background:rgba(10,10,10,.92);box-shadow:0 0 42px rgba(255,149,0,.08)}
    .prompt{margin:0 0 16px;color:var(--accent);font-size:16px;line-height:1.7;text-shadow:0 0 8px rgba(255,149,0,.16)}.line{margin:6px 0;color:var(--text);font-size:14px;line-height:1.65}.line:before{content:"> ";color:var(--muted)}
    .cursor{display:inline-block;width:.7ch;height:1.15em;margin-left:4px;vertical-align:-.16em;background:var(--accent);animation:blink 1s steps(1,end) infinite}@keyframes blink{50%{opacity:0}}
    .error{display:none;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,149,0,.18)}.error.is-visible{display:block}.error-title{margin:0 0 7px;color:var(--danger);font-size:14px}.error-message{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.6}
    .actions{display:flex;flex-wrap:wrap;gap:9px}.btn{appearance:none;border:1px solid var(--border);border-radius:6px;padding:8px 11px;background:rgba(255,149,0,.07);color:var(--accent2);text-decoration:none;cursor:pointer;transition:background .12s ease,border-color .12s ease}.btn:hover,.btn:focus-visible{border-color:var(--accent);background:rgba(255,149,0,.14);outline:none}
    .past{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:20;width:min(330px,calc(100vw - 36px));border:1px solid var(--border);border-radius:8px;background:var(--panel);box-shadow:0 10px 36px rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .16s ease,transform .16s ease}.past.is-visible{opacity:1;transform:translateY(0);pointer-events:auto}.past.is-collapsed{width:auto;max-width:calc(100vw - 36px)}
    .past-collapsed{display:none;width:100%;appearance:none;border:0;padding:10px 12px;background:transparent;color:var(--accent);text-align:left;cursor:pointer}.past.is-collapsed .past-collapsed{display:block}.past.is-collapsed .past-expanded{display:none}.past-expanded{padding:14px}.eyebrow{margin:0 0 9px;color:var(--accent);font-size:11px;letter-spacing:.11em}.past-label{margin:0;color:var(--accent2);font-size:18px;font-weight:700}.past-date{margin:4px 0 11px;color:var(--text);font-size:13px}.past-copy{margin:0 0 14px;color:var(--muted);font-size:12px;line-height:1.6}.past-close{position:absolute;top:8px;right:8px;width:30px;height:30px;appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer}.past-close:hover,.past-close:focus-visible{color:var(--accent);outline:none}
    @media(max-width:640px){.terminal{min-height:170px;padding:18px}.past{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:min(330px,calc(100vw - 24px))}}
    @media(prefers-reduced-motion:reduce){.snapshot,.travel,.past{transition:none}.cursor{animation:none}}
  </style>
</head>
<body>
  <iframe id="snapshot" class="snapshot" title="博客历史快照" referrerpolicy="strict-origin-when-cross-origin"></iframe>

  <div id="travel" class="travel" aria-live="polite">
    <div class="terminal">
      <p class="prompt">$ time<span class="cursor" aria-hidden="true"></span></p>
      <p class="line">locating a point in blog history...</p>
      <p class="line">reading immutable snapshots...</p>
      <p class="line">travelling...</p>
      <div id="error" class="error" role="alert">
        <p id="error-title" class="error-title">connection to the past was lost.</p>
        <p id="error-message" class="error-message">无法加载这个历史快照。</p>
        <div class="actions">
          <button id="retry" class="btn" type="button">🎲 再随机一次</button>
          <a class="btn" href="/">↩ 回到现在</a>
        </div>
      </div>
    </div>
  </div>

  <aside id="past" class="past" aria-label="Time Machine 控制面板">
    <button id="past-collapsed" class="past-collapsed" type="button">PAST · <span id="past-date-short">----</span></button>
    <div class="past-expanded">
      <button id="past-close" class="past-close" type="button" aria-label="收起 Time Machine">×</button>
      <p class="eyebrow">BLOG TIME MACHINE</p>
      <p class="past-label">PAST</p>
      <p id="past-date" class="past-date">----</p>
      <p class="past-copy">你正在浏览博客过去的一个不可变快照。</p>
      <div class="actions">
        <button id="random-again" class="btn" type="button">🎲 再随机一次</button>
        <a class="btn" href="/">↩ 回到现在</a>
      </div>
    </div>
  </aside>

  <script>
    (function(){
      "use strict";

      var HISTORY_BASE="https://raw.githubusercontent.com/Liudon/liudon.github.io/ipfs-history";
      var SNAPSHOT_BASE="https://liudon.xyz/ipfs";
      var LOAD_TIMEOUT_MS=15000;
      var MIN_TRAVEL_MS=650;
      var AUTO_COLLAPSE_MS=1800;
      var MAX_RANDOM_ATTEMPTS=40;

      var frame=document.getElementById("snapshot");
      var travel=document.getElementById("travel");
      var errorBox=document.getElementById("error");
      var errorTitle=document.getElementById("error-title");
      var errorMessage=document.getElementById("error-message");
      var retryButton=document.getElementById("retry");
      var past=document.getElementById("past");
      var pastCollapsed=document.getElementById("past-collapsed");
      var pastClose=document.getElementById("past-close");
      var randomAgain=document.getElementById("random-again");
      var pastDate=document.getElementById("past-date");
      var pastDateShort=document.getElementById("past-date-short");

      var monthCache=new Map();
      var historyIndex=null;
      var latestCid=null;
      var currentSnapshot=null;
      var loadToken=0;
      var autoCollapseTimer=null;
      var userControlledPanel=false;

      function fetchJson(path){
        return fetch(HISTORY_BASE+"/"+path,{cache:"no-store",headers:{Accept:"application/json"}}).then(function(response){
          if(!response.ok)throw new Error("HTTP "+response.status+" while loading "+path);
          return response.json();
        });
      }

      async function loadHistoryIndex(){
        if(historyIndex)return historyIndex;
        var result=await Promise.all([fetchJson("months.json"),fetchJson("latest.json")]);
        var months=result[0];
        var latest=result[1];

        if(months.version!==2||!Number.isInteger(months.total)||months.total<1||!Array.isArray(months.months)){
          throw new Error("Invalid months.json");
        }

        var calculatedTotal=months.months.reduce(function(sum,item){
          if(!item||typeof item.month!=="string"||!Number.isInteger(item.count)||item.count<0){
            throw new Error("Invalid month index entry");
          }
          return sum+item.count;
        },0);

        if(calculatedTotal!==months.total)throw new Error("Timeline index count mismatch");

        historyIndex=months;
        latestCid=typeof latest.cid==="string"?latest.cid:null;
        return historyIndex;
      }

      async function loadMonth(month){
        if(monthCache.has(month))return monthCache.get(month);

        var response=await fetch(HISTORY_BASE+"/history/"+month+".jsonl",{cache:"no-store"});
        if(!response.ok)throw new Error("HTTP "+response.status+" while loading "+month);

        var text=await response.text();
        var seen=new Set();
        var rows=[];

        text.split("\\n").forEach(function(rawLine){
          var line=rawLine.trim();
          if(!line)return;
          var row=JSON.parse(line);
          if(!row||typeof row.cid!=="string"||typeof row.deployed_at!=="string")return;
          if(seen.has(row.cid))return;
          seen.add(row.cid);
          rows.push(row);
        });

        monthCache.set(month,rows);
        return rows;
      }

      function locateGlobalIndex(globalIndex){
        var offset=globalIndex;
        for(var i=0;i<historyIndex.months.length;i+=1){
          var item=historyIndex.months[i];
          if(offset<item.count){
            return {month:item.month,index:offset,expectedCount:item.count};
          }
          offset-=item.count;
        }
        throw new Error("Random index outside timeline");
      }

      async function randomSnapshot(){
        await loadHistoryIndex();

        if(historyIndex.total<=1&&latestCid)throw new Error("NO_HISTORY");

        for(var attempt=0;attempt<MAX_RANDOM_ATTEMPTS;attempt+=1){
          var globalIndex=Math.floor(Math.random()*historyIndex.total);
          var location=locateGlobalIndex(globalIndex);
          var rows=await loadMonth(location.month);

          if(rows.length!==location.expectedCount){
            throw new Error("Timeline shard mismatch for "+location.month+": "+rows.length+" != "+location.expectedCount);
          }

          var snapshot=rows[location.index];
          if(!snapshot)continue;
          if(latestCid&&snapshot.cid===latestCid)continue;
          if(currentSnapshot&&snapshot.cid===currentSnapshot.cid)continue;
          return snapshot;
        }

        throw new Error("NO_ALTERNATIVE");
      }

      function formatSnapshotTime(iso){
        var date=new Date(iso);
        if(Number.isNaN(date.getTime()))return {full:iso,short:iso.slice(0,10)};

        var parts=new Intl.DateTimeFormat("zh-CN",{
          timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit",
          hour:"2-digit",minute:"2-digit",hourCycle:"h23"
        }).formatToParts(date);

        var values={};
        parts.forEach(function(part){values[part.type]=part.value;});
        var short=values.year+"-"+values.month+"-"+values.day;
        return {full:short+" · "+values.hour+":"+values.minute,short:short};
      }

      function hideError(){errorBox.classList.remove("is-visible");}
      function showError(title,message){
        errorTitle.textContent=title;
        errorMessage.textContent=message;
        errorBox.classList.add("is-visible");
      }

      function showTravel(){
        clearTimeout(autoCollapseTimer);
        past.classList.remove("is-visible");
        frame.classList.remove("is-visible");
        travel.classList.remove("is-hidden");
        hideError();
      }

      function expandPast(manual){
        if(manual){userControlledPanel=true;clearTimeout(autoCollapseTimer);}
        past.classList.remove("is-collapsed");
      }

      function collapsePast(manual){
        if(manual){userControlledPanel=true;clearTimeout(autoCollapseTimer);}
        past.classList.add("is-collapsed");
      }

      function revealPast(snapshot){
        var formatted=formatSnapshotTime(snapshot.deployed_at);
        pastDate.textContent=formatted.full;
        pastDateShort.textContent=formatted.short;
        userControlledPanel=false;
        expandPast(false);
        past.classList.add("is-visible");

        clearTimeout(autoCollapseTimer);
        autoCollapseTimer=setTimeout(function(){
          if(!userControlledPanel)collapsePast(false);
        },AUTO_COLLAPSE_MS);
      }

      function waitForFrame(token){
        return new Promise(function(resolve,reject){
          var timeout=setTimeout(function(){
            cleanup();
            reject(new Error("Snapshot load timed out"));
          },LOAD_TIMEOUT_MS);

          function cleanup(){
            clearTimeout(timeout);
            frame.removeEventListener("load",onLoad);
          }

          function onLoad(){
            cleanup();
            if(token!==loadToken){
              reject(new Error("Snapshot load superseded"));
              return;
            }
            resolve();
          }

          frame.addEventListener("load",onLoad,{once:true});
        });
      }

      async function travelToRandomSnapshot(){
        var token=++loadToken;
        var startedAt=performance.now();
        showTravel();

        try{
          var snapshot=await randomSnapshot();
          if(token!==loadToken)return;

          var loaded=waitForFrame(token);
          frame.src=SNAPSHOT_BASE+"/"+snapshot.cid+"/";
          await loaded;

          var remaining=MIN_TRAVEL_MS-(performance.now()-startedAt);
          if(remaining>0)await new Promise(function(resolve){setTimeout(resolve,remaining);});
          if(token!==loadToken)return;

          currentSnapshot=snapshot;
          frame.classList.add("is-visible");
          revealPast(snapshot);
          travel.classList.add("is-hidden");
        }catch(error){
          if(token!==loadToken)return;
          console.error(error);

          if(error.message==="NO_HISTORY"){
            showError("no historical snapshots available yet.","当前没有可用于时间旅行的历史快照。");
          }else if(error.message==="NO_ALTERNATIVE"){
            showError("no other point in time is available.","目前没有另一个可随机的历史快照。");
          }else if(/months\\.json|latest\\.json|Timeline|month index|HTTP/.test(error.message)){
            showError("unable to locate the timeline.","读取博客历史索引失败，可以重新尝试。");
          }else{
            showError("connection to the past was lost.","历史快照加载失败，可以随机尝试另一个时间点。");
          }
        }
      }

      pastCollapsed.addEventListener("click",function(){expandPast(true);});
      pastClose.addEventListener("click",function(){collapsePast(true);});
      randomAgain.addEventListener("click",travelToRandomSnapshot);
      retryButton.addEventListener("click",travelToRandomSnapshot);

      travelToRandomSnapshot();
    })();
  </script>
</body>
</html>
